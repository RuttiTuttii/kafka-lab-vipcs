name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # собираем и тестируем каждый .NET сервис, у которого уже есть проект
      - name: build and test services
        shell: bash
        run: |
          status=0
          for dir in services/*/; do
            if ls "$dir"*.sln "$dir"*.csproj >/dev/null 2>&1; then
              echo "::group::$dir"
              dotnet build "$dir" -c Release || status=1
              dotnet test "$dir" -c Release --no-build || status=1
              echo "::endgroup::"
            else
              echo "skip $dir: .NET проекта нет"
            fi
          done
          exit $status
